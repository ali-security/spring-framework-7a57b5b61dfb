name: seal-build

# Spring Framework 4.2.0 ships no GitHub Actions CI (upstream built on Bamboo,
# build.spring.io). This workflow mirrors the project's own Gradle build:
# ./gradlew (Gradle 2.5 wrapper) on JDK 8 (main sources compile with
# source/target 1.6, tests with 1.8 + -parameters), running the real JUnit
# suites of spring-expression and spring-core, then building the jar.

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Gradle test task + selector to run instead of the full suites (e.g. ':spring-expression:test --tests *EvaluationTests')"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: "-Xmx2g -XX:MaxPermSize=512m -Dfile.encoding=UTF-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Write test-logging init script
        run: |
          cat > "$RUNNER_TEMP/seal-test-logging.gradle" <<'EOF'
          allprojects {
            tasks.withType(Test) {
              testLogging {
                events "failed", "skipped"
                exceptionFormat "full"
              }
              afterSuite { desc, result ->
                if (desc.parent == null) {
                  println "TEST TOTALS ${path}: ${result.resultType} tests=${result.testCount} passed=${result.successfulTestCount} failed=${result.failedTestCount} skipped=${result.skippedTestCount}"
                } else if (desc.className != null) {
                  println "TEST SUITE ${desc.className}: ${result.resultType} tests=${result.testCount} passed=${result.successfulTestCount} failed=${result.failedTestCount} skipped=${result.skippedTestCount}"
                }
              }
            }
          }
          EOF

      - name: Test
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            ./gradlew --no-daemon -I "$RUNNER_TEMP/seal-test-logging.gradle" ${{ inputs.test-filter }}
          else
            ./gradlew --no-daemon -I "$RUNNER_TEMP/seal-test-logging.gradle" :spring-core:test :spring-expression:test
          fi

      - name: Test report (counts and skip reasons)
        if: ${{ !cancelled() }}
        run: |
          cat > "$RUNNER_TEMP/seal_report.py" <<'EOF'
          import glob, os, re, sys
          import xml.etree.ElementTree as ET

          def src_for(cls):
              for mod in ("spring-core", "spring-expression"):
                  p = os.path.join(mod, "src/test/java", cls.split("$")[0].replace(".", "/") + ".java")
                  if os.path.exists(p):
                      return p
              return None

          def reason(cls, meth, depth=0):
              p = src_for(cls)
              if not p or depth > 5:
                  return "skipped by JUnit (assumption not met)"
              src = open(p, encoding="utf-8", errors="replace").read()
              d = re.search(r"\bvoid\s+" + re.escape(meth) + r"\s*\(", src)
              if d:
                  head = src[:d.start()]
                  cut = max(head.rfind("}"), head.rfind(";"))
                  window = head[cut + 1:]
                  if "@Ignore" in window:
                      note = re.search(r"@Ignore(?:\(([^)]*)\))?(.*)", window, re.S)
                      extra = (note.group(1) or "") + " " + " ".join(re.findall(r"//\s*(.*)", window))
                      return "@Ignore on method" + (": " + extra.strip() if extra.strip() else "")
              body = re.search(r"void\s+" + re.escape(meth) + r"\s*\([^)]*\)[^{]*\{(.*?)\n\t\}", src, re.S)
              text = body.group(1) if body else ""
              g = re.search(r"Assume\.group\(\s*TestGroup\.(\w+)", text)
              if g:
                  return "Assume.group(TestGroup.%s) - group not enabled (-PtestGroups unset)" % g.group(1)
              a = re.search(r"assume\w*\([^;]*", text)
              if a:
                  return "JUnit assumption not met: " + a.group(0).strip()
              c = re.search(r"@Ignore(?:\(([^)]*)\))?\s*(?:@\w+(?:\([^)]*\))?\s*)*public\s+(?:abstract\s+)?class", src)
              if c:
                  return "@Ignore on class" + (": " + c.group(1) if c.group(1) else "")
              g = re.search(r"Assume\.group\(\s*TestGroup\.(\w+)", src)
              if g:
                  return "Assume.group(TestGroup.%s) in class setup - group not enabled (-PtestGroups unset)" % g.group(1)
              e = re.search(r"class\s+\w+(?:<[^{]*?>)?\s+extends\s+([\w.]+)", src)
              if e:
                  parent = e.group(1)
                  if "." not in parent:
                      parent = cls.rsplit(".", 1)[0] + "." + parent
                  return reason(parent, meth, depth + 1)
              return "skipped by JUnit (assumption not met)"

          total = fail = skip = 0
          for f in sorted(glob.glob("*/build/test-results/TEST-*.xml")):
              root = ET.parse(f).getroot()
              for tc in root.iter("testcase"):
                  total += 1
                  if tc.find("failure") is not None or tc.find("error") is not None:
                      fail += 1
                      print("FAILED %s.%s" % (tc.get("classname"), tc.get("name")))
                  elif tc.find("skipped") is not None:
                      skip += 1
                      print("SKIPPED %s.%s -- %s" % (tc.get("classname"), tc.get("name"), reason(tc.get("classname"), tc.get("name"))))
          print("JUNIT SUMMARY: tests=%d passed=%d failed=%d skipped=%d" % (total, total - fail - skip, fail, skip))
          if total == 0:
              print("ERROR: no test results found")
              sys.exit(1)
          EOF
          python3 "$RUNNER_TEMP/seal_report.py"

      - name: Build jar
        run: ./gradlew --no-daemon :spring-expression:jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-expression-jar
          path: spring-expression/build/libs/spring-expression-4.2.0.RELEASE.jar
          if-no-files-found: error
